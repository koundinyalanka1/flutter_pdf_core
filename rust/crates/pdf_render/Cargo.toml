[package]
name = "pdf_render"
version.workspace = true
edition.workspace = true

[dependencies]
pdf_core = { path = "../pdf_core" }
pdf_ops = { path = "../pdf_ops" }
pdf_text = { path = "../pdf_text" }
thiserror.workspace = true
flate2.workspace = true

# Standalone image codecs only, not a replacement PDF renderer. Disable SIMD
# and image-crate adapters to keep all Android ABIs on the same safe Rust path.
jpeg-decoder = { version = "0.3", default-features = false }
hayro-jpeg2000 = { path = "../../vendor/hayro-jpeg2000", version = "=0.4.1", default-features = false, features = ["std"] }
hayro-jbig2 = { path = "../../vendor/hayro-jbig2", version = "=0.3.1", default-features = false, features = ["std"] }
